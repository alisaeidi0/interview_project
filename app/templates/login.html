<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Floor Assistant</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">
      <span class="brand-mark">⬢</span>
      <h1>Floor Assistant</h1>
    </div>
    <p class="auth-sub">Documentation answers for the plant floor — safety, maintenance &amp; quality.</p>

    {% if error %}
    <div class="auth-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <p class="auth-hint">Prototype demo — a supervisor account is seeded locally.</p>
  </main>
</body>
</html>
