<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Floor Assistant</title>
  <link rel="stylesheet" href="/static/css/styles.css" />
  <script>
    (function () { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); })();
  </script>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-head">
      <div class="brand"><span class="brand-mark">⬢</span><h1>Admin console</h1></div>
      <a class="btn-ghost" href="/chat">← Back to chat</a>
    </div>
    <p class="admin-sub">Review signup requests and manage user roles. Signed in as {{ user.name }} (admin).</p>

    <table class="admin-table" id="users-table">
      <thead>
        <tr>
          <th>User</th><th>Requested</th><th>Role</th><th>Status</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="users-body">
        <tr><td colspan="5" class="admin-empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
